name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: QEMU'yu Termux deposundan indir
        run: python3 scripts/fetch_qemu_termux.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Kod analizi
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test imajları üret (kendi OS, disketler, gerçek Linux ISO'ları)
        run: bash scripts/make_test_media.sh "$RUNNER_TEMP/media"

      - name: İşletim sistemi algılama testleri
        env:
          STRATA_TEST_MEDIA: ${{ runner.temp }}/media
        run: flutter test --reporter expanded

      - name: APK derle
        run: flutter build apk --release --target-platform android-arm64

      - name: APK'yı adlandır
        run: cp build/app/outputs/flutter-apk/app-release.apk StrataVM.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StrataVM-apk
          path: StrataVM.apk

      # Telefondan kolay indirmek için: Releases > "son-surum" > StrataVM.apk
      - name: Son sürümü yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum StrataVM.apk --title "Strata VM (son derleme)" \
            --notes "Otomatik derleme: ${GITHUB_SHA::7}" --target "$GITHUB_SHA"

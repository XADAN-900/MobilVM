name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: QEMU'yu Termux deposundan indir
        run: python3 scripts/fetch_qemu_termux.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Çeviri denetimi (8 dil)
        run: python3 scripts/check_i18n.py

      - name: Kod analizi
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test imajları üret (kendi OS, disketler, gerçek Linux ISO'ları)
        run: bash scripts/make_test_media.sh "$RUNNER_TEMP/media"

      - name: QEMU açılış testi (tüm mimariler, gerçek QEMU ile)
        run: |
          sudo apt-get install -y -qq qemu-system-x86 qemu-system-arm qemu-system-ppc qemu-system-misc qemu-utils >/dev/null
          qemu-system-x86_64 --version | head -1
          mkdir -p "$RUNNER_TEMP/rt" "$RUNNER_TEMP/smoke-classes"
          unzip -q -o android/app/src/main/assets/qemu-runtime.zip 'share/*' -d "$RUNNER_TEMP/rt"
          curl -fsSL -o "$RUNNER_TEMP/json.jar" https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          javac -encoding UTF-8 -d "$RUNNER_TEMP/smoke-classes" -cp "$RUNNER_TEMP/json.jar" \
            android/app/src/main/java/app/strata/vm/QemuArgs.java \
            android/app/src/main/java/app/strata/vm/VmConfig.java \
            scripts/QemuArgsSmoke.java
          java -cp "$RUNNER_TEMP/smoke-classes:$RUNNER_TEMP/json.jar" app.strata.vm.QemuArgsSmoke \
            "$RUNNER_TEMP/rt/share/qemu" "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/media"

      - name: İşletim sistemi algılama testleri
        env:
          STRATA_TEST_MEDIA: ${{ runner.temp }}/media
          STRATA_TEST_FONTS: ${{ runner.temp }}/media/fonts
        run: flutter test --reporter expanded

      - name: APK derle
        run: flutter build apk --release --target-platform android-arm64

      - name: APK'yı adlandır
        run: cp build/app/outputs/flutter-apk/app-release.apk StrataVM.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StrataVM-apk
          path: StrataVM.apk

      # Telefondan kolay indirmek için: Releases > "son-surum" > StrataVM.apk
      - name: Son sürümü yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum StrataVM.apk --title "Strata VM (son derleme)" \
            --notes "Otomatik derleme: ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
